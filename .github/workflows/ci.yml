name: CI

on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
  schedule:
    - cron: '0 0 */1 * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: '${{ github.workflow }}-${{ github.head_ref || github.ref }}'
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup GO
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.4'

      - name: Download modules
        run: go mod download

      - name: go-test
        shell: bash        
        run: make test-acc

      - name: go-test-examples
        shell: bash
        run: make test-examples

      - name: go-coverage
        shell: bash
        run: |-
          OUTPUT="$(make test-coverage)"
          TOTAL="$(echo $OUTPUT | awk 'END{print $NF}')"
          echo "::group::Coverage (${TOTAL})"
          echo "${OUTPUT}"
          echo "::endgroup::"

  lint:
    name: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write # reviewdog github-pr-check reporter
    strategy:
      fail-fast: false

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: reviewdog/action-setup@d8a7baabd7f3e8544ee4dbde3ee41d0011c3a93f # v1.5.0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.4'

      - name: Download modules
        run: go mod download

      - name: go-lint
        shell: bash
        run: |-
          set -eEu
          set +o pipefail
          make lint

      - name: govulncheck
        shell: bash
        run: |-
          set -eEu
          go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 -tags=google ./...
          cd examples/ssr-oidc && go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

      - name: copyright-check
        shell: bash
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ github.token }}
        run: |-
          set -eEu
          set +o pipefail

          # Require a copyright header with any plausible year — existing files
          # keep their original year; only the header's presence is enforced.
          find . -type f -name '*.go' -exec awk 'FNR==1{if ($0!~"Copyright 20[0-9][0-9]" && $0!~"Code generated") print FILENAME ":1:missing copyright header";}' '{}' + | \
          reviewdog -efm="%f:%l:%m" \
            -name="copyright-check" \
            -reporter="github-pr-check" \
            -filter-mode="diff_context" \
            -fail-on-error="true" \
            -level="error"

      - name: generate-check
        shell: bash
        run: |-
          set -eEu
          set +o pipefail
          make generate-check

      - name: tab-check
        shell: bash
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ github.token }}
        run: |-
          set -eEu
          set +o pipefail

          make tabcheck | \
          reviewdog -efm="%f:%l:%m" \
            -name="tab-check" \
            -reporter="github-pr-check" \
            -filter-mode="diff_context" \
            -fail-on-error="true" \
            -level="error"
