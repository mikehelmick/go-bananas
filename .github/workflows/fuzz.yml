name: Fuzz

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

# Crash inputs are never uploaded as artifacts: on a public repo they would be
# public proofs of concept. A failure only fails the job, and the maintainer
# reproduces it locally with `make fuzz` (D19).
permissions:
  contents: read

concurrency:
  group: '${{ github.workflow }}-${{ github.ref }}'
  cancel-in-progress: false

jobs:
  fuzz:
    name: fuzz
    runs-on: ubuntu-latest
    # About 40 targets at 60s each, plus compile and minimization time.
    timeout-minutes: 120
    env:
      GOTOOLCHAIN: local

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup GO
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.27.4'

      - name: Download modules
        run: go mod download

      - name: go-fuzz
        shell: bash
        run: make fuzz FUZZTIME=60s
