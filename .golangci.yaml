version: '2'

run:
  # default: none
  timeout: '5m'

  # default: []
  build-tags:
  - 'all'

  # default: ''
  modules-download-mode: 'readonly'

  # default: false
  allow-parallel-runners: true

linters:
  # errcheck, govet, ineffassign, staticcheck and unused are on by default.
  # gosimple and stylecheck are now part of staticcheck.
  enable:
  - 'asciicheck'
  - 'bodyclose'
  - 'dogsled'
  - 'errorlint'
  - 'exhaustive'
  - 'goheader'
  - 'gomodguard_v2'
  - 'goprintffuncname'
  - 'gosec'
  - 'makezero'
  - 'misspell'
  - 'nakedret'
  - 'noctx'
  - 'nolintlint'
  - 'paralleltest'
  - 'prealloc'
  - 'predeclared'
  - 'revive'
  - 'sqlclosecheck'
  - 'staticcheck'
  - 'unconvert'
  - 'whitespace'

  exclusions:
    generated: 'lax'
    # Matches v1's default exclusions.
    presets:
    - 'comments'
    - 'common-false-positives'
    - 'legacy'
    - 'std-error-handling'
    paths:
    - 'third_party$'
    - 'builtin$'
    - 'examples$'
    rules:
    - linters: ['staticcheck']
      text: '^S1023:' # staticcheck: redundant returns help with http handlers
    - linters: ['staticcheck']
      text: '^SA3000:' # staticcheck: not required in Go 11.4+
    - linters: ['gosec']
      text: '^G101:' # gosec: many false positives
    - linters: ['gosec']
      text: '^G102:' # gosec: we have to bind to all ifaces
    - linters: ['gosec']
      text: '^G203:' # gosec: we sanitize HTML
    - linters: ['gosec']
      text: '^G505:' # gosec: we use crypto/sha1 for some HMACs
    - linters: ['paralleltest']
      text: '^Range statement' # paralleltest: false positives
    - linters: ['revive']
      text: '^if-return' # revive: false positives

    # Tests legitimately make plain HTTP requests to local test servers.
    - path: '_test\.go'
      linters:
      - 'noctx'
      - 'gosec'

formatters:
  enable:
  - 'gofmt'
  - 'goimports'
  exclusions:
    generated: 'lax'
    paths:
    - 'third_party$'
    - 'builtin$'
    - 'examples$'

issues:
  # default: 50
  max-issues-per-linter: 0

  # default: 3
  max-same-issues: 0

severity:
  # default: ''
  default: 'error'
